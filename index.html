<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6200ea">
  <title>Focus RPG</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f0f13; color: #ffffff; margin: 0; padding: 14px; max-width: 500px; margin: auto; }
    
    .level-card { background: linear-gradient(135deg, #1e1b2e 0%, #151520 100%); padding: 16px; border-radius: 14px; border: 1px solid #322a56; margin-bottom: 12px; }
    .level-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .level-badge { background: #6200ea; color: #fff; font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; }
    .level-title { font-size: 15px; font-weight: 800; color: #e2d9ff; }
    .xp-numbers { font-size: 12px; color: #a599cc; font-weight: 600; }
    .xp-bar-bg { width: 100%; height: 10px; background: #0a0a0f; border-radius: 99px; overflow: hidden; border: 1px solid #2a2440; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #7c4dff, #00e676); width: 0%; transition: width 0.4s ease; }

    .header-grid { display: flex; gap: 10px; margin-bottom: 16px; }
    .card { flex: 1; background: #181820; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #282836; }
    .card-title { font-size: 10px; color: #888; letter-spacing: 1px; font-weight: 700; }
    .coins { font-size: 24px; font-weight: 800; color: #ffd700; margin-top: 4px; }
    .streak { font-size: 24px; font-weight: 800; color: #ff6d00; margin-top: 4px; }
    .streak-sub { font-size: 10px; color: #777; margin-top: 3px; }

    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 10px 4px; background: #181820; border: 1px solid #282836; color: #999; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab.active { background: #6200ea; color: #fff; border-color: #7c4dff; }
    .section { display: none; }
    .section.active { display: block; }

    .input-group { display: flex; gap: 6px; margin-bottom: 14px; }
    input { padding: 11px; border-radius: 8px; border: 1px solid #333344; background: #181820; color: #fff; font-size: 14px; }
    input[type="text"] { flex: 2; width: 100%; }
    input[type="number"] { flex: 1; min-width: 65px; }
    button.add-btn { padding: 0 16px; background: #00e676; color: #000; border: none; border-radius: 8px; font-weight: 900; font-size: 18px; cursor: pointer; }

    .item { background: #181820; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid #262632; gap: 8px; }
    .item.done-today { opacity: 0.45; border-color: #1b5e20; }
    .sort-controls { display: flex; flex-direction: column; gap: 3px; }
    .sort-btn { background: #232330; color: #aaa; border: 1px solid #333345; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; line-height: 1; }
    .sort-btn:disabled { opacity: 0.2; cursor: default; }
    .item-info { display: flex; flex-direction: column; gap: 3px; flex: 1; word-break: break-word; }
    .item-title { font-size: 14px; font-weight: 600; color: #f0f0f5; }
    .badge { color: #ffd700; font-weight: 700; font-size: 12px; }
    .item-actions { display: flex; align-items: center; gap: 5px; }
    .action-btn { background: #2979ff; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .action-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
    .del-btn { background: #ff1744; color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    .backup-box { margin-top: 26px; padding-top: 14px; border-top: 1px solid #282836; display: flex; gap: 8px; flex-wrap: wrap; }
    .backup-btn { flex: 1; padding: 10px; background: #1c1c26; color: #bbb; border: 1px solid #333344; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; min-width: 120px; }
  </style>
</head>
<body>

  <div class="level-card">
    <div class="level-top">
      <div>
        <span class="level-badge" id="level-num">LEVEL 1</span>
        <span class="level-title" id="level-title" style="margin-left: 6px;">Novice Planner</span>
      </div>
      <div class="xp-numbers" id="xp-text">0 / 150 XP</div>
    </div>
    <div class="xp-bar-bg">
      <div class="xp-bar-fill" id="xp-bar"></div>
    </div>
  </div>

  <div class="header-grid">
    <div class="card">
      <div class="card-title">WALLET</div>
      <div class="coins">🪙 <span id="coin-balance">0</span></div>
      <div class="streak-sub">Spendable Coins</div>
    </div>
    <div class="card">
      <div class="card-title">ACTIVE STREAK</div>
      <div class="streak">🔥 <span id="streak-count">0</span></div>
      <div class="streak-sub" id="streak-status">Complete 1 task today!</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('dailies', this)">🔄 Dailies</button>
    <button class="tab" onclick="switchTab('tasks', this)">🎯 Quests</button>
    <button class="tab" onclick="switchTab('shop', this)">🛒 Shop</button>
  </div>

  <div id="dailies" class="section active">
    <div class="input-group">
      <input type="text" id="daily-name" placeholder="Daily habit (e.g. Study 2 hrs)">
      <input type="number" id="daily-coins" placeholder="Coins">
      <button class="add-btn" onclick="addDaily()">+</button>
    </div>
    <div id="daily-list"></div>
  </div>

  <div id="tasks" class="section">
    <div class="input-group">
      <input type="text" id="task-name" placeholder="One-time quest (e.g. Mock Test)">
      <input type="number" id="task-coins" placeholder="Coins">
      <button class="add-btn" onclick="addTask()">+</button>
    </div>
    <div id="task-list"></div>
  </div>

  <div id="shop" class="section">
    <div class="input-group">
      <input type="text" id="reward-name" placeholder="Reward (e.g. 20m YouTube)">
      <input type="number" id="reward-cost" placeholder="Cost">
      <button class="add-btn" onclick="addReward()">+</button>
    </div>
    <div id="reward-list"></div>
  </div>

  <div class="backup-box">
    <button class="backup-btn" onclick="exportData()">📋 Copy Backup</button>
    <button class="backup-btn" onclick="importData()">📥 Restore Backup</button>
  </div>

  <script>
    const LEVELS = [
      { level: 1, title: "Novice Planner", min: 0 },
      { level: 2, title: "Action Taker", min: 150 },
      { level: 3, title: "Habit Builder", min: 400 },
      { level: 4, title: "Focus Initiate", min: 800 },
      { level: 5, title: "Momentum Maker", min: 1400 },
      { level: 6, title: "Deep Work Practitioner", min: 2200 },
      { level: 7, title: "Discipline Architect", min: 3300 },
      { level: 8, title: "Execution Machine", min: 4700 },
      { level: 9, title: "High-Output Strategist", min: 6500 },
      { level: 10, title: "Grandmaster of Focus", min: 9000 }
    ];

    let defaultData = {
      coins: 0,
      totalEarned: 0,
      streak: 0,
      lastActiveDate: null,
      lastResetDate: null,
      dailies: [],
      tasks: [],
      rewards: []
    };

    let saved = JSON.parse(localStorage.getItem('rpgData') || '{}');
    let data = Object.assign({}, defaultData, saved);

    if (!data.totalEarned || data.totalEarned < data.coins) {
      data.totalEarned = data.coins;
    }

    function getTodayStr() {
      return new Date().toDateString();
    }

    function getYesterdayStr() {
      let d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toDateString();
    }

    function getLevelDetails(xp) {
      let current = LEVELS[0];
      let next = null;
      for (let i = 0; i < LEVELS.length; i++) {
        if (xp >= LEVELS[i].min) {
          current = LEVELS[i];
          next = LEVELS[i + 1] || null;
        }
      }
      return { current, next };
    }

    function awardCoins(amount) {
      let oldLvl = getLevelDetails(data.totalEarned).current.level;
      data.coins += amount;
      data.totalEarned += amount;
      let newLvlObj = getLevelDetails(data.totalEarned).current;
      if (newLvlObj.level > oldLvl) {
        alert('⚡ LEVEL UP! You are now Level ' + newLvlObj.level + ': ' + newLvlObj.title + '!');
      }
    }

    function checkDailyReset() {
      const today = getTodayStr();
      const yesterday = getYesterdayStr();

      if (data.lastResetDate !== today) {
        data.dailies.forEach(d => d.completedToday = false);
        data.lastResetDate = today;
      }

      if (data.lastActiveDate && data.lastActiveDate !== today && data.lastActiveDate !== yesterday) {
        data.streak = 0;
      }

      saveData();
    }

    function triggerDailyStreak() {
      const today = getTodayStr();
      const yesterday = getYesterdayStr();

      if (data.lastActiveDate !== today) {
        if (data.lastActiveDate === yesterday) {
          data.streak += 1;
        } else {
          data.streak = 1;
        }
        data.lastActiveDate = today;
        
        let bonus = Math.min(data.streak * 5, 50);
        awardCoins(bonus);
        alert('🔥 ' + data.streak + '-Day Streak! +' + bonus + ' Bonus Coins & XP!');
      }
    }

    function moveItem(listName, index, direction) {
      const list = data[listName];
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= list.length) return;
      const temp = list[index];
      list[index] = list[targetIndex];
      list[targetIndex] = temp;
      saveData();
    }

    function saveData() {
      localStorage.setItem('rpgData', JSON.stringify(data));
      render();
    }

    function render() {
      const xp = data.totalEarned || 0;
      const { current, next } = getLevelDetails(xp);
      document.getElementById('level-num').innerText = 'LEVEL ' + current.level;
      document.getElementById('level-title').innerText = current.title;

      if (next) {
        let span = next.min - current.min;
        let progress = xp - current.min;
        let pct = Math.min(100, Math.floor((progress / span) * 100));
        document.getElementById('xp-text').innerText = xp + ' / ' + next.min + ' XP';
        document.getElementById('xp-bar').style.width = pct + '%';
      } else {
        document.getElementById('xp-text').innerText = xp + ' XP (MAX)';
        document.getElementById('xp-bar').style.width = '100%';
      }

      document.getElementById('coin-balance').innerText = data.coins;
      document.getElementById('streak-count').innerText = data.streak;
      
      const today = getTodayStr();
      const statusEl = document.getElementById('streak-status');
      if (data.lastActiveDate === today) {
        statusEl.innerText = "Streak locked in! ✅";
        statusEl.style.color = "#00e676";
      } else {
        statusEl.innerText = "Finish 1 task for streak!";
        statusEl.style.color = "#ffab00";
      }

      const dailyList = document.getElementById('daily-list');
      dailyList.innerHTML = '';
      data.dailies.forEach((d, i) => {
        dailyList.innerHTML += `
          <div class="item ${d.completedToday ? 'done-today' : ''}">
            <div class="sort-controls">
              <button class="sort-btn" onclick="moveItem('dailies', ${i}, -1)" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="sort-btn" onclick="moveItem('dailies', ${i}, 1)" ${i === data.dailies.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
            <div class="item-info">
              <span class="item-title">${d.name}</span>
              <span class="badge">+${d.coins} 🪙 / day</span>
            </div>
            <div class="item-actions">
              <button class="action-btn" onclick="completeDaily(${i})" ${d.completedToday ? 'disabled' : ''}>
                ${d.completedToday ? 'Done ✓' : 'Done'}
              </button>
              <button class="del-btn" onclick="deleteDaily(${i})">✕</button>
            </div>
          </div>`;
      });

      const taskList = document.getElementById('task-list');
      taskList.innerHTML = '';
      data.tasks.forEach((t, i) => {
        taskList.innerHTML += `
          <div class="item">
            <div class="sort-controls">
              <button class="sort-btn" onclick="moveItem('tasks', ${i}, -1)" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="sort-btn" onclick="moveItem('tasks', ${i}, 1)" ${i === data.tasks.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
            <div class="item-info">
              <span class="item-title">${t.name}</span>
              <span class="badge">+${t.coins} 🪙</span>
            </div>
            <div class="item-actions">
              <button class="action-btn" onclick="completeTask(${i})">Done</button>
              <button class="del-btn" onclick="deleteTask(${i})">✕</button>
            </div>
          </div>`;
      });

      const rewardList = document.getElementById('reward-list');
      rewardList.innerHTML = '';
      data.rewards.forEach((r, i) => {
        rewardList.innerHTML += `
          <div class="item">
            <div class="sort-controls">
              <button class="sort-btn" onclick="moveItem('rewards', ${i}, -1)" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button class="sort-btn" onclick="moveItem('rewards', ${i}, 1)" ${i === data.rewards.length - 1 ? 'disabled' : ''}>▼</button>
            </div>
            <div class="item-info">
              <span class="item-title">${r.name}</span>
              <span class="badge">-${r.cost} 🪙</span>
            </div>
            <div class="item-actions">
              <button class="action-btn" onclick="buyReward(${i})">Buy</button>
              <button class="del-btn" onclick="deleteReward(${i})">✕</button>
            </div>
          </div>`;
      });
    }

    function addDaily() {
      const name = document.getElementById('daily-name').value.trim();
      const coins = parseInt(document.getElementById('daily-coins').value);
      if (name && coins > 0) {
        data.dailies.push({ name, coins, completedToday: false });
        document.getElementById('daily-name').value = '';
        document.getElementById('daily-coins').value = '';
        saveData();
      }
    }

    function completeDaily(i) {
      if (!data.dailies[i].completedToday) {
        data.dailies[i].completedToday = true;
        awardCoins(data.dailies[i].coins);
        triggerDailyStreak();
        saveData();
      }
    }

    function deleteDaily(i) {
      data.dailies.splice(i, 1);
      saveData();
    }

    function addTask() {
      const name = document.getElementById('task-name').value.trim();
      const coins = parseInt(document.getElementById('task-coins').value);
      if (name && coins > 0) {
        data.tasks.push({ name, coins });
        document.getElementById('task-name').value = '';
        document.getElementById('task-coins').value = '';
        saveData();
      }
    }

    function completeTask(i) {
      awardCoins(data.tasks[i].coins);
      data.tasks.splice(i, 1);
      triggerDailyStreak();
      saveData();
    }

    function deleteTask(i) {
      data.tasks.splice(i, 1);
      saveData();
    }

    function addReward() {
      const name = document.getElementById('reward-name').value.trim();
      const cost = parseInt(document.getElementById('reward-cost').value);
      if (name && cost > 0) {
        data.rewards.push({ name, cost });
        document.getElementById('reward-name').value = '';
        document.getElementById('reward-cost').value = '';
        saveData();
      }
    }

    function buyReward(i) {
      if (data.coins >= data.rewards[i].cost) {
        data.coins -= data.rewards[i].cost;
        alert('🎉 Enjoy your reward guilt-free: ' + data.rewards[i].name + '!');
        saveData();
      } else {
        alert('Not enough coins! Knock out a task first.');
      }
    }

    function deleteReward(i) {
      data.rewards.splice(i, 1);
      saveData();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function exportData() {
      navigator.clipboard.writeText(JSON.stringify(data));
      alert('Backup copied! Paste it into your Notes or WhatsApp.');
    }

    function importData() {
      const input = prompt('Paste your backup code here:');
      if (input) {
        try {
          data = Object.assign({}, defaultData, JSON.parse(input));
          if (!data.totalEarned || data.totalEarned < data.coins) {
            data.totalEarned = data.coins;
          }
          saveData();
          alert('Data restored successfully!');
        } catch (e) {
          alert('Invalid backup code.');
        }
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    checkDailyReset();
  </script>
</body>
  </html>
